[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hipps-dimes"
version = "3.0"
description = "Maximum Entropy Model for 4D Genome"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Guang Shi", email = "guang.shi.gs@gmail.com"}
]
keywords = ["computational-biology", "3d-genome", "chromatin", "3d-structure", "hi-c", "polymer-physics", "chromatin-dynamics", "chromatin-mechanics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "rich-click>=1.7.0",
    "numpy>=2.0.0",
    "scipy>=1.11.0",
    "pandas>=1.3.0",
    "tqdm>=4.60.0",
    "cooler>=0.10.3",
    "rich>=10.0.0",
    "hic-straw>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "flake8>=4.0.0",
    "mypy>=0.900",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/anyuzx/HIPPS-DIMES"
Documentation = "https://github.com/anyuzx/HIPPS-DIMES#readme"
Repository = "https://github.com/anyuzx/HIPPS-DIMES.git"
"Bug Tracker" = "https://github.com/anyuzx/HIPPS-DIMES/issues"

[project.scripts]
HippsDimes = "hipps_dimes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["hipps_dimes", "hipps_dimes.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=hipps_dimes --cov=HippsDimes --cov-report=term-missing --cov-report=html"
